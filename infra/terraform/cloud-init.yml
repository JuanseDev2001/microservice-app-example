#cloud-config
package_update: true
package_upgrade: false

packages:
  - curl
  - git

runcmd:
  # Quick Docker installation using convenience script (faster)
  - curl -fsSL https://get.docker.com -o get-docker.sh
  - sh get-docker.sh
  - systemctl start docker
  - systemctl enable docker
  - usermod -aG docker azureuser
  
  # Install Docker Compose standalone
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose
  
  # Create project directory
  - mkdir -p /home/azureuser/microservice-app
  - chown azureuser:azureuser /home/azureuser/microservice-app
  
  # Create a simple status file to indicate cloud-init completion
  - echo "Cloud-init completed at $(date)" > /home/azureuser/cloud-init-complete.txt
  - chown azureuser:azureuser /home/azureuser/cloud-init-complete.txt

write_files:
  - path: /home/azureuser/start-services.sh
    content: |
      #!/bin/bash
      cd /home/azureuser/microservice-app
      docker-compose up -d
    permissions: '0755'
    owner: azureuser:azureuser