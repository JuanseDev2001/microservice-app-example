#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

runcmd:
  # Install Docker
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl start docker
  - systemctl enable docker
  - usermod -aG docker azureuser
  
  # Install Docker Compose standalone
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose
  
  # Create project directory
  - mkdir -p /home/azureuser/microservice-app
  - chown azureuser:azureuser /home/azureuser/microservice-app
  
  # Create docker-compose file
  - echo "${docker_compose_content}" | base64 -d > /home/azureuser/microservice-app/docker-compose.yml
  - chown azureuser:azureuser /home/azureuser/microservice-app/docker-compose.yml
  
  # Clone the repository (you might want to use your specific branch)
  - cd /home/azureuser/microservice-app
  - git clone https://github.com/JuanseDev2001/microservice-app-example.git .
  - chown -R azureuser:azureuser /home/azureuser/microservice-app
  
  # Start the services
  - cd /home/azureuser/microservice-app
  - sudo -u azureuser docker-compose up -d

write_files:
  - path: /home/azureuser/start-services.sh
    content: |
      #!/bin/bash
      cd /home/azureuser/microservice-app
      docker-compose up -d
    permissions: '0755'
    owner: azureuser:azureuser