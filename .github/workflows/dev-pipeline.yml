name: Development Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies and run linters
      run: |
        echo "🔍 Running code quality checks for development..."
        
        # Java - Maven checkstyle
        cd users-api
        ./mvnw checkstyle:check || echo "⚠️ Java checkstyle warnings found"
        cd ..
        
        # Node.js - ESLint
        cd todos-api
        npm install
        npm run lint || echo "⚠️ Node.js lint warnings found"
        cd ..
        
        # Frontend - ESLint
        cd frontend
        npm install
        npm run lint || echo "⚠️ Frontend lint warnings found"
        cd ..
        
        echo "✅ Code quality checks completed"

  quick-tests:
    name: Quick Development Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Run quick tests
      run: |
        echo "🧪 Running quick tests for development branch..."
        
        # Java - Unit tests only (skip integration)
        echo "Testing Users API (Java)..."
        cd users-api
        ./mvnw test -Dtest="*Test" --batch-mode --no-transfer-progress
        cd ..
        
        # Node.js - Quick tests
        echo "Testing Todos API (Node.js)..."
        cd todos-api
        npm install
        npm test || echo "⚠️ Some Node.js tests failed"
        cd ..
        
        # Go - Quick tests
        echo "Testing Auth API (Go)..."
        cd auth-api
        go test -v -short ./... || echo "⚠️ Some Go tests failed"
        cd ..
        
        # Python - Quick tests
        echo "Testing Log Processor (Python)..."
        cd log-message-processor
        pip install -r requirements.txt
        python -m pytest -v --tb=short || echo "⚠️ Some Python tests failed"
        cd ..
        
        echo "✅ Quick tests completed"

  dev-build:
    name: Development Build
    runs-on: ubuntu-latest
    needs: quick-tests
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build development images
      run: |
        echo "🐳 Building development Docker images..."
        
        # Build only changed services for faster dev cycle
        docker build -t dev/users-api:latest ./users-api
        docker build -t dev/todos-api:latest ./todos-api  
        docker build -t dev/auth-api:latest ./auth-api
        docker build -t dev/log-processor:latest ./log-message-processor
        docker build -t dev/frontend:latest ./frontend
        
        echo "✅ Development images built successfully"
        
    - name: Test docker-compose configuration
      run: |
        echo "🔧 Testing docker-compose configuration..."
        docker-compose config
        echo "✅ Docker-compose configuration is valid"

  dev-integration:
    name: Development Integration Test
    runs-on: ubuntu-latest
    needs: dev-build
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Start services for integration testing
      run: |
        echo "🚀 Starting services for integration testing..."
        docker-compose up -d
        
        # Wait for services to be ready
        sleep 45
        
        echo "🔍 Checking service health..."
        docker-compose ps
        
    - name: Run integration tests
      run: |
        echo "🧪 Running integration tests..."
        
        # Test frontend
        curl -f http://localhost:9083 || (echo "❌ Frontend not responding" && exit 1)
        
        # Test users API with cache
        curl -f http://localhost:9081/users/cache/stats || (echo "❌ Users API cache not working" && exit 1)
        
        # Test todos API
        curl -f http://localhost:9080/api/todos || (echo "❌ Todos API not responding" && exit 1)
        
        # Test auth API
        curl -f http://localhost:9082/login || (echo "❌ Auth API not responding" && exit 1)
        
        echo "✅ All integration tests passed!"
        
    - name: Cleanup
      if: always()
      run: |
        echo "🧹 Cleaning up development environment..."
        docker-compose down
        docker system prune -f

  dev-notification:
    name: Development Notification
    runs-on: ubuntu-latest
    needs: [lint-and-format, quick-tests, dev-build, dev-integration]
    if: always()
    
    steps:
    - name: Development summary
      run: |
        echo "📊 Development Pipeline Summary for branch: dev"
        echo "=================================="
        echo "✅ Code Quality: ${{ needs.lint-and-format.result }}"
        echo "✅ Quick Tests: ${{ needs.quick-tests.result }}"
        echo "✅ Dev Build: ${{ needs.dev-build.result }}"
        echo "✅ Integration: ${{ needs.dev-integration.result }}"
        echo "=================================="
        
        if [[ "${{ needs.lint-and-format.result }}" == "success" && \
              "${{ needs.quick-tests.result }}" == "success" && \
              "${{ needs.dev-build.result }}" == "success" && \
              "${{ needs.dev-integration.result }}" == "success" ]]; then
          echo "🎉 Development pipeline completed successfully!"
          echo "💡 Ready for feature branch creation or main merge"
        else
          echo "⚠️ Some development checks failed - review needed"
        fi