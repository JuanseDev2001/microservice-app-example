name: Infrastructure Pipeline - Staging

on:
  push:
    branches: [ env/staging ]
  pull_request:
    branches: [ env/staging ]

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate Docker Compose files
      run: |
        echo "Validating infrastructure configuration..."
        
        # Check if docker-compose files exist and are valid
        if [ -f "infrastructure/docker-compose.staging.yml" ]; then
          docker-compose -f infrastructure/docker-compose.staging.yml config
        else
          echo "No staging docker-compose file found"
        fi
        
        # Validate main docker-compose
        docker-compose config
        
        echo "Infrastructure validation completed"
        
    - name: Security scan
      run: |
        echo "Running security scans..."
        # Here you could add security tools like:
        # - Docker image vulnerability scanning
        # - Secrets detection
        # - Infrastructure security checks
        echo "Security scan completed"

  plan:
    name: Plan Infrastructure Changes
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate deployment plan
      run: |
        echo "Generating infrastructure deployment plan..."
        echo "## Infrastructure Changes" >> $GITHUB_STEP_SUMMARY
        echo "- Docker Compose configuration updates" >> $GITHUB_STEP_SUMMARY
        echo "- Service configuration changes" >> $GITHUB_STEP_SUMMARY
        echo "- Environment variable updates" >> $GITHUB_STEP_SUMMARY
        echo "Plan generated and will be applied after PR merge"
        
    - name: Comment PR with plan
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## Infrastructure Deployment Plan\n\n Validation passed\n Ready to apply infrastructure changes to **staging**\n\nChanges will be applied automatically after PR merge.'
          })

  apply:
    name: Apply to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/env/staging'
    environment: staging-infrastructure
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Apply infrastructure changes
      run: |
        echo "Applying infrastructure changes to staging..."
        
        # Stop existing services
        docker-compose down || true
        
        # Apply new configuration
        if [ -f "infrastructure/docker-compose.staging.yml" ]; then
          docker-compose -f infrastructure/docker-compose.staging.yml up -d
        else
          docker-compose up -d
        fi
        
        sleep 30
        echo "Infrastructure applied to staging"
        
    - name: Health checks
      run: |
        echo "Running health checks..."
        
        # Check all services are running
        docker-compose ps
        
        # Test basic connectivity
        curl -f http://localhost:9083 || (echo "Frontend health check failed" && exit 1)
        curl -f http://localhost:9081/users/cache/stats || (echo "Users API health check failed" && exit 1)
        
        echo "All health checks passed"
        
    - name: Notify success
      run: |
        echo "Staging infrastructure deployment completed successfully!"
        echo "Services status:" 
        docker-compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"